<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditor CSF</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="app">
  <nav class="lateral" aria-label="Navegación principal">
    <a class="marca" href="#/auditar">
      <img src="img/logo.png" alt="">
      <span><strong>AUDITOR CSF</strong><span>NIST CSF 2.0 y SP 800-53</span></span>
    </a>

    <div class="menu">
      <span class="menu-titulo">AUDITAR Y ESTUDIAR</span>
      <a href="#/auditar" data-vista="auditar">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="m9 15 2 2 4-4"/></svg>
        Auditar
      </a>
      <a href="#/informe" data-vista="informe">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Último informe
      </a>
      <a href="#/catalogo" data-vista="catalogo">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h7"/></svg>
        Catálogo de controles
      </a>
      <a href="#/practicar" data-vista="practicar">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6l-5.4 2.9 1.2-6-4.5-4.2 6.1-.7z"/></svg>
        Practicar
      </a>
      <a href="#/preguntar" data-vista="preguntar">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        Preguntar
      </a>
    </div>

    <div class="menu">
      <span class="menu-titulo">SISTEMA</span>
      <a href="#/sistema" data-vista="sistema">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 16v-5"/><path d="M11 16V6"/><path d="M16 16v-8"/></svg>
        Métricas y configuración
      </a>
      <a href="#/creditos" data-vista="creditos">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 9"/></svg>
        Créditos
      </a>
    </div>

    <div class="espaciador"></div>
    <a id="recuadro" class="recuadro" href="#/auditar" hidden></a>
    <div id="estado-servicio" class="estado-servicio" role="status"><span class="punto"></span><span>Verificando el servicio…</span></div>
  </nav>

  <main id="vista" class="contenido" tabindex="-1"></main>
</div>
<div id="avisos" class="avisos" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
