# Configuración para las pruebas automáticas (proveedor simulado, base en memoria).
servicio:
  host: 127.0.0.1
  puerto: 8099
  directorio_datos: /tmp/auditor_pruebas
  origenes_web: ["*"]
proveedor_modelos: simulado
url_ollama: http://127.0.0.1:11434
modelos:
  rutas:
    simple: {modelo: sim-simple, tiempo_limite_s: 30}
    compleja: {modelo: sim-complejo, tiempo_limite_s: 30}
  respaldo: sim-respaldo
  modelo_reformulacion: sim-simple
  reintentos: 1
  num_ctx: 4096
  temperatura: 0.1
  max_tokens_salida: 600
embeddings:
  modelo: sim-embed
  prefijos: {}
  lote: 64
base_vectorial: {tipo: memoria, coleccion: pruebas}
fragmentacion: {tamano: 800, solapamiento: 120}
recuperacion: {k: 4, umbral: 0.30, max_fragmentos_prompt: 12}
agente: {umbral_recuperacion_pobre: 0.33, max_iteraciones: 3}
cache: {ttl_horas: 24, umbral_semantico: 0.95}
enrutador: {umbral_complejidad: 4}
guardrails: {max_comandos: 300, max_bytes: 400000, min_proporcion_shell: 0.5}
